<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bir tomchi sayohati</title>
<style>
:root{--bg:#171029;--fg:#f4ead4;--muted:#a99cc4;--btn:#e8557f;--btnfg:#fff}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f0e5cd;--fg:#2a1f3d;--muted:#6b5d80}}
:root[data-theme="light"]{--bg:#f0e5cd;--fg:#2a1f3d;--muted:#6b5d80}
:root[data-theme="dark"]{--bg:#171029;--fg:#f4ead4;--muted:#a99cc4}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:Georgia,"Iowan Old Style",serif;
 min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:12px}
.frame{position:relative;width:min(100%,720px);aspect-ratio:1/1;border-radius:14px;overflow:hidden;
 background:#120c22;box-shadow:0 18px 50px rgba(0,0,0,.4)}
canvas{display:block;width:100%;height:100%;cursor:pointer;touch-action:manipulation}
.cap{position:absolute;left:0;right:0;bottom:0;padding:14px 16px;display:flex;justify-content:space-between;
 align-items:flex-end;gap:12px;pointer-events:none;
 background:linear-gradient(to top,rgba(10,6,20,.55),rgba(10,6,20,0))}
.cap b{font-weight:normal;font-size:17px;color:#fdf3dd;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.cap i{font-style:normal;font-size:13px;color:#d6c6ef;text-shadow:0 1px 6px rgba(0,0,0,.6);font-variant-numeric:tabular-nums}
.track{width:min(100%,720px);height:3px;background:rgba(140,120,180,.28);border-radius:99px;overflow:hidden}
.track div{height:100%;width:0;background:var(--btn)}
.bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center}
button{font:inherit;font-size:16px;background:var(--btn);color:var(--btnfg);border:0;border-radius:999px;padding:10px 22px;cursor:pointer}
button:focus-visible{outline:3px solid var(--fg);outline-offset:3px}
p{margin:0;font-size:14px;color:var(--muted);text-align:center;max-width:62ch;line-height:1.55}
body.render .cap,body.render .track,body.render .bar,body.render p{display:none}
body.render{padding:0;background:#000}
body.render .frame{border-radius:0;box-shadow:none;width:100vmin;max-width:none}
</style>
</head>
<body>
<div class="frame">
 <canvas id="c" aria-label="Yomg'ir tomchisidan boshlanib yana o'sha tomchiga qaytadigan uzluksiz animatsiya"></canvas>
 <div class="cap"><b id="lbl">Deraza</b><i id="tc">0:00</i></div>
</div>
<div class="track"><div id="bar"></div></div>
<div class="bar"><button id="snd" aria-pressed="false">Ovozni yoqish</button></div>
<p>Sakkiz sahna, bitta uzluksiz kadr — oxiri boshiga ulanadi. Rasm ham, video ham, audio fayl ham yo'q: har bir piksel va har bir tovush kodda yaratiladi.</p>
<script>
(()=>{
const RENDER=new URLSearchParams(location.search).has('render');
if(RENDER)document.body.classList.add('render');
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const A=document.createElement('canvas'),B=document.createElement('canvas');
let g=A.getContext('2d');                       // scenes draw through this
const L=1000;let px=1,texLinen,texDots,vign;
const TAU=Math.PI*2;
const lerp=(a,b,k)=>a+(b-a)*k;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const easeOut=t=>1-Math.pow(1-t,3);
const rnd=(a,b)=>a+Math.random()*(b-a);
function rr(seed){let s=seed;return()=>{s=(s*16807)%2147483647;return(s-1)/2147483646};}
function gradient(x0,y0,x1,y1,stops){const G=g.createLinearGradient(x0,y0,x1,y1);for(const[o,c]of stops)G.addColorStop(o,c);return G;}
function kf(p,frames){
 for(let i=0;i<frames.length-1;i++){const a=frames[i],b=frames[i+1];
  if(p<=b[0]){const u=ease(clamp((p-a[0])/((b[0]-a[0])||1),0,1));
   return{x:lerp(a[1],b[1],u),y:lerp(a[2],b[2],u),z:lerp(a[3],b[3],u)};}}
 const l=frames[frames.length-1];return{x:l[1],y:l[2],z:l[3]};
}
// chromatic rim light, the signature of the whole piece
function rim(path,w,a){
 g.lineJoin='round';g.lineCap='round';g.globalAlpha=(a==null?.5:a);
 g.strokeStyle='#35d7ff';g.lineWidth=w;g.save();g.translate(-5,3);g.stroke(path);g.restore();
 g.strokeStyle='#ff3ab0';g.save();g.translate(5,-2);g.stroke(path);g.restore();
 g.globalAlpha=1;
}
function halo(cx,cy,rad,col,step){            // halftone glow, dots not gradients
 g.beginPath();const s=step||13;
 for(let y=cy-rad;y<cy+rad;y+=s)for(let x=cx-rad;x<cx+rad;x+=s){
  const d=Math.hypot(x-cx,y-cy)/rad;if(d>=1)continue;
  const r=Math.pow(1-d,1.15)*s*.48;if(r<.1)continue;g.moveTo(x+r,y);g.arc(x,y,r,0,TAU);}
 g.fillStyle=col;g.fill();
}
// shafts all leave one sun, so they spread and can never cross each other
function shafts(sx,sy,n,spread,alpha,t,col){
 g.globalCompositeOperation='lighter';
 for(let i=0;i<n;i++){
  const a=(i/(n-1)-.5)*spread+Math.sin(t*.17+i*1.3)*.012;
  g.save();g.translate(sx,sy);g.rotate(a);
  g.fillStyle=`rgba(${col||'140,214,255'},${alpha*(.62+.38*Math.sin(t*.5+i*1.7))})`;
  g.beginPath();g.moveTo(-15,0);g.lineTo(15,0);g.lineTo(88,3200);g.lineTo(-88,3200);g.closePath();g.fill();
  g.restore();}
 g.globalCompositeOperation='source-over';
}
// events a scene raises so its sound can be triggered by the thing you can see
const EV={whale:0,boom:0,bird:0,pop:0,chirp:0,siren:0,flit:0},EVSEEN={};

/* ===================== SCENE DATA ===================== */
const R1=rr(7),R2=rr(23),R3=rr(91),R4=rr(41),R5=rr(55),R6=rr(67),R7=rr(83),R8=rr(103);
// 1 window
const bldg=[];{let x=250;while(x<1080){const w=44+R1()*70,h=120+R1()*240,win=[];
 for(let y=880-h+16;y<854;y+=26)for(let ix=x+9;ix<x+w-13;ix+=19)if(R1()<.42)win.push([ix,y,R1()<.75]);
 bldg.push({x,w,h,win,c:R1()<.5?'#3b2385':'#4a2d9e'});x+=w+6+R1()*13;}}
const rainL=[];for(let i=0;i<150;i++)rainL.push({x:250+R1()*760,y:R1()*880,l:26+R1()*58,s:640+R1()*520});
const beads=[];for(let i=0;i<52;i++)beads.push({x:255+R1()*740,y:R1()*840,r:3.2+R1()*6.4,ph:R1()*9});
// 2 drop interior
const bub=[];for(let i=0;i<70;i++)bub.push({x:R2()*1000,y:R2()*1000,r:2+R2()*9,s:24+R2()*52,ph:R2()*9});
const jelly=[];for(let i=0;i<8;i++)jelly.push({x:90+R2()*820,y:R2()*1400,r:42+R2()*46,ph:R2()*9,sp:.5+R2()*.5,dx:(R2()-.5)*26});
const snow=[];for(let i=0;i<150;i++)snow.push({x:R2()*1000,y:R2()*1000,r:.8+R2()*2.2,v:6+R2()*16,ph:R2()*9});
const dist=[];for(let i=0;i<6;i++)dist.push({x:40+R2()*920,y:R2()*1400,r:20+R2()*20,ph:R2()*9,sp:.6+R2()*.5,dx:(R2()-.5)*18});
// 3 whale — half-heights above and below the centreline, snout (s=-1) to peduncle (s=1)
const fish=[];for(let i=0;i<50;i++)fish.push({x:R3()*1000,y:180+R3()*640,s:5+R3()*6,ph:R3()*9,v:30+R3()*40});
const WPROF=[[-1,4,11],[-.92,20,36],[-.8,40,60],[-.62,58,78],[-.4,68,84],[-.15,70,79],
 [.1,64,68],[.35,52,52],[.6,36,34],[.8,20,18],[.93,10,9],[1,3,3]];
// 4 volcano
const ash=[];for(let i=0;i<80;i++)ash.push({x:R4()*1000,y:R4()*1000,r:1.2+R4()*2.6,v:10+R4()*28,ph:R4()*9});
// 5 desert
const cact=[];for(let i=0;i<9;i++){const arms=[];
 const n=R5()<.32?2:(R5()<.78?1:0);
 for(let k=0;k<n;k++)arms.push({side:k?1:(R5()<.5?-1:1),reach:26+R5()*30,
  at:52+R5()*54,up:34+R5()*56,t:17+R5()*7});
 cact.push({x:60+R5()*900,s:.55+R5()*.8,h:104+R5()*84,w:22+R5()*10,arms});}
const birds=[];for(let i=0;i<9;i++)birds.push({x:R5()*1000,y:120+R5()*220,s:.6+R5()*.8,ph:R5()*9});
// 6 hummingbird
const blooms=[];for(let i=0;i<10;i++)blooms.push({x:60+R6()*900,y:150+R6()*700,a:-.6+R6()*1.2,s:.8+R6()*.6});
const far=[];for(let i=0;i<9;i++)far.push({x:-40+R6()*1080,y:80+R6()*820,a:-.7+R6()*1.4,s:.6+R6()*.5});
const visit=[];                                    // only blooms the camera can actually see
blooms.forEach((b,i)=>{if(b.x>250&&b.x<790&&b.y>210&&b.y<760)visit.push(i);});
if(visit.length<3)for(let i=0;i<blooms.length;i++)if(!visit.includes(i))visit.push(i);
const pollen=[];for(let i=0;i<60;i++)pollen.push({x:R6()*1000,y:R6()*1000,r:1.5+R6()*3,ph:R6()*9});
// 7 city — buildings sit in the blocks between streets, cars run along the streets
const GS=90,GN=5;
const blocks=[];
for(let i=-GN;i<GN;i++)for(let j=-GN;j<GN;j++){
 const cx=500+(i+.5)*GS,cy=500+(j+.5)*GS;
 if(Math.hypot(cx-500,cy-500)>450)continue;
 const inset=15+R7()*7;
 blocks.push({x:cx-GS/2+inset,y:cy-GS/2+inset,w:GS-inset*2,h:GS-inset*2,
  tall:.25+Math.pow(R7(),1.6)*.95,n:2+((R7()*3)|0),lit:R7(),ph:R7()*9,park:R7()<.1});}
const cars=[];
for(let i=0;i<52;i++)cars.push({ax:R7()<.5?0:1,line:((R7()*(2*GN+1))|0)-GN,
 pos:R7()*1000-500,v:(R7()<.5?-1:1)*(70+R7()*120),len:10+R7()*13,hot:R7()<.5});
// 8 vinyl
const grooves=[];for(let i=0;i<46;i++)grooves.push(132+i*5.4+R8()*2.2);

/* ===================== SCENES ===================== */
const SC=[];

SC.push({name:"Deraza",dur:9,enter:1,
 space:['t',0.12],trim:1.62,
 bed:[['p',1.6,'bandpass',1500,2.2,0.187,-.35],['p',2.4,'bandpass',3000,2.6,0.121,.35],
  ['p',.55,'lowpass',240,.8,0.055,0]],
 acc:(dt,w,d)=>{if(Math.random()<dt*5*w&&gate('tap',140))burst(tapBufs[(Math.random()*tapBufs.length)|0],rnd(.8,1.35),rnd(.38,.88),rnd(-.85,.85),d);},
 cam:p=>kf(p,[[0,742,248,4.0],[.16,742,248,4.0],[.44,500,500,1],[.72,500,500,1],[1,742,248,3.4]]),
 draw(t,p){
  const heroR=p<.16?18:(p<.6?lerp(18,16,(p-.16)/.44):lerp(16,44,(p-.6)/.4));
  g.fillStyle='#b83d17';g.fillRect(-300,-300,1600,1600);
  g.save();g.beginPath();g.rect(240,0,760,880);g.clip();
  g.fillStyle=gradient(0,0,0,880,[[0,'#2a3496'],[.5,'#3f58cc'],[1,'#51309c']]);g.fillRect(240,0,760,880);
  for(const b of bldg){g.fillStyle=b.c;g.fillRect(b.x,880-b.h,b.w,b.h);
   g.fillStyle='#ffd83d';for(const w of b.win)if(w[2]||Math.sin(t*.7+w[0])>.6)g.fillRect(w[0],w[1],8,10);}
  for(const lp of [[345,566],[946,520]]){            // a glow needs a lamp under it
   g.strokeStyle='#241046';g.lineWidth=7;
   g.beginPath();g.moveTo(lp[0],lp[1]+14);g.lineTo(lp[0],880);g.stroke();
   g.fillStyle='#241046';g.beginPath();g.ellipse(lp[0],lp[1]+6,17,11,0,0,TAU);g.fill();}
  g.globalCompositeOperation='lighter';
  halo(345,560,140,'rgba(255,196,60,.85)');halo(946,514,132,'rgba(255,196,60,.8)');
  g.globalCompositeOperation='source-over';
  g.strokeStyle='rgba(205,238,255,.5)';g.lineWidth=2;g.beginPath();
  for(const r of rainL){const y=(r.y+t*r.s)%1060-90;g.moveTo(r.x,y);g.lineTo(r.x-r.l*.07,y-r.l);}g.stroke();
  // drops on the glass: each one swells where it sits, then breaks loose and runs
  for(const b of beads){
   const P=5.5+b.ph*1.1, u=((t+b.ph*7)%P)/P;
   const hold=.62;
   const r=u<hold?lerp(b.r*.35,b.r*1.5,u/hold):b.r*1.5;
   const run=u<hold?0:Math.pow((u-hold)/(1-hold),2)*300;
   const y=b.y+run, x=b.x+Math.sin(y*.05+b.ph)*3;
   if(y>870)continue;
   g.fillStyle='rgba(28,30,110,.32)';g.beginPath();g.arc(x+r*.3,y+r*.3,r,0,TAU);g.fill();
   g.fillStyle='rgba(188,232,255,.5)';g.beginPath();g.arc(x,y,r,0,TAU);g.fill();
   if(run>6){g.strokeStyle='rgba(188,232,255,.22)';g.lineWidth=r*.7;  // the wet track it leaves
    g.beginPath();g.moveTo(x,y-run*.5);g.lineTo(x,y);g.stroke();}}
  // the hero bead — the door out of this scene
  g.fillStyle='rgba(22,26,96,.42)';g.beginPath();g.arc(742+heroR*.22,248+heroR*.26,heroR,0,TAU);g.fill();
  g.fillStyle='rgba(176,226,255,.62)';g.beginPath();g.arc(742,248,heroR,0,TAU);g.fill();
  g.strokeStyle='rgba(235,250,255,.85)';g.lineWidth=heroR*.09;g.beginPath();g.arc(742,248,heroR*.92,0,TAU);g.stroke();
  g.fillStyle='rgba(255,255,255,.92)';g.beginPath();g.arc(742-heroR*.34,248-heroR*.36,heroR*.26,0,TAU);g.fill();
  g.globalCompositeOperation='lighter';               // the glass itself, so the drops are on something
  g.fillStyle='rgba(200,228,255,.055)';
  g.beginPath();g.moveTo(300,0);g.lineTo(520,0);g.lineTo(170,880);g.lineTo(-50,880);g.closePath();g.fill();
  g.beginPath();g.moveTo(760,0);g.lineTo(860,0);g.lineTo(520,880);g.lineTo(420,880);g.closePath();g.fill();
  g.globalCompositeOperation='source-over';
  g.restore();
  g.fillStyle='#e24f93';g.fillRect(240,288,760,24);
  g.fillStyle='#7a2710';g.fillRect(226,0,20,880);
  g.fillStyle='#d2561f';g.fillRect(-300,880,1600,420);g.fillStyle='#8f2d10';g.fillRect(-300,880,1600,9);
  const cols=['#f28a24','#d24d17','#f5a531','#c8431a','#ef7d22','#d9561a','#f29a2c'];
  const edge=(i,y)=>{const tie=Math.exp(-(((y-560)/250)**2))*.8;
   return i*33+(118+i*11-i*33)*tie+Math.sin(t*.7+i*.7)*4*(y/1000)*(1-tie);};
  for(let i=0;i<7;i++){g.beginPath();
   for(let y=-40;y<=1040;y+=24)g.lineTo(edge(i,y),y);
   for(let y=1040;y>=-40;y-=24)g.lineTo(edge(i+1,y)+2,y);
   g.closePath();g.fillStyle=cols[i];g.fill();}
  g.fillStyle='#f2c230';g.fillRect(66,536,172,46);
  // cat
  const br=1+Math.sin(t*1.15)*.030;
  const body=new Path2D();body.moveTo(556,880);
  body.bezierCurveTo(506,790,526,650,600,586);body.bezierCurveTo(622,562,632,536,640,506);
  body.bezierCurveTo(680,490,726,492,758,512);body.bezierCurveTo(770,546,790,570,816,600);
  body.bezierCurveTo(880,670,886,810,830,880);body.closePath();
  const tw=Math.max(0,Math.sin(t*.9))>.97?Math.sin(t*34)*13:0;   // an ear flicks now and then
  const head=new Path2D();head.ellipse(700,448,80,70,0,0,TAU);
  head.moveTo(628,432);head.lineTo(640,338);head.lineTo(695,386);head.closePath();
  head.moveTo(706,386);head.lineTo(762+tw*.5,338-tw);head.lineTo(776,434);head.closePath();
  const neck=new Path2D();                                       // the shoulders rise to meet the skull
  neck.moveTo(648,452);
  neck.bezierCurveTo(634,504,616,544,606,624);
  neck.lineTo(804,624);
  neck.bezierCurveTo(794,544,776,502,760,452);
  neck.closePath();
  const tail=new Path2D();const sw=Math.sin(t*1.1)*20;   // an open sweep: a closed curl leaves a
  tail.moveTo(804,874);                                   // pocket between tail and body, and
  tail.bezierCurveTo(890,896,950+sw*.5,868,978+sw,812);   // the window shows through it as a hole
  tail.bezierCurveTo(996+sw,776,1000+sw,736,992+sw,702);  // punched in the cat. So it only sweeps away.
  g.fillStyle='#ef5aa6';g.beginPath();g.ellipse(690,890,212,36,0,0,TAU);g.fill();
  const turn=Math.sin(t*.62)*.17+Math.sin(t*.27+1.4)*.07;       // the head keeps watching the rain
  // one colour per layer over every part at once: overlapping fills merge, so the cat has no inner seams
  const paintCat=(col,grow,dx,dy)=>{
   g.save();g.translate(dx,dy);
   g.fillStyle=col;g.strokeStyle=col;g.lineJoin='round';g.lineCap='round';
   const P=q=>{if(grow>0){g.lineWidth=grow*2;g.stroke(q);}g.fill(q);};
   g.save();g.translate(690,880);g.scale(1,br);g.translate(-690,-880);P(body);P(neck);g.restore();
   g.save();g.translate(turn*26,(1-br)*-380);g.translate(700,520);g.rotate(turn);g.translate(-700,-520);
   P(head);g.restore();
   g.lineWidth=26+grow*2;g.stroke(tail);
   g.restore();};
  g.globalAlpha=.55;paintCat('#35d7ff',13,-5,3);paintCat('#ff3ab0',13,5,-2);g.globalAlpha=1;
  paintCat('#ff8a2a',4.5,0,0);
  paintCat('#120c16',0,0,0);
  g.save();g.translate(turn*26,(1-br)*-380);g.translate(700,520);g.rotate(turn);g.translate(-700,-520);
  g.strokeStyle='rgba(255,245,230,.8)';g.lineWidth=2;g.beginPath();
  g.moveTo(632,478);g.lineTo(546,462);g.moveTo(634,488);g.lineTo(548,492);
  g.moveTo(768,478);g.lineTo(856,458);g.moveTo(766,488);g.lineTo(854,490);g.stroke();
  g.restore();
 }});

SC.push({name:"Tomchi ichida",dur:9,
 space:['t',0.22],trim:0.95,
 bed:[['p',.5,'lowpass',300,1.4,0.187,0],['p',.8,'bandpass',620,3.0,0.088,.55],
  ['p',1.0,'bandpass',1500,3.4,0.0495,-.3]],
 acc:(dt,w,d)=>{if(EV.pop!==EVSEEN.pop){EVSEEN.pop=EV.pop;                 // a blip per visible burst
   if(gate('pop',300))tone(rnd(500,1400),rnd(1500,2600),rnd(.12,.3),.13,'sine',d);}},
 cam:p=>kf(p,[[0,500,380,1.15],[1,500,660,1.5]]),
 draw(t,p){
  g.fillStyle='#08284a';g.fillRect(-400,-400,1800,1800);
  const G=g.createRadialGradient(500,420,60,500,520,760);
  G.addColorStop(0,'#1f8fb0');G.addColorStop(.45,'#0d5a86');G.addColorStop(1,'#04203f');
  g.fillStyle=G;g.fillRect(-400,-400,1800,1800);
  // the wall of the drop we just entered, drifting away
  const wall=clamp(1-p*2.1,0,1);
  if(wall>.01){g.globalAlpha=wall*.55;g.strokeStyle='#bfefff';g.lineWidth=26;
   g.beginPath();g.arc(500,430,280+p*1500,0,TAU);g.stroke();g.globalAlpha=1;}
  // light shafts from the surface
  g.globalCompositeOperation='lighter';
  for(let i=0;i<6;i++){const a=-1.35+i*.26+Math.sin(t*.22+i)*.05;
   g.save();g.translate(430+i*38,-260);g.rotate(a);
   g.fillStyle=`rgba(150,230,255,${.085+.045*Math.sin(t*.7+i)})`;
   g.beginPath();g.moveTo(-26,0);g.lineTo(26,0);g.lineTo(150,1500);g.lineTo(-150,1500);g.closePath();g.fill();
   g.restore();}
  g.globalCompositeOperation='source-over';
  for(const m of snow){const y=(m.y-t*m.v)%1200;
   g.fillStyle='rgba(200,240,255,.34)';g.beginPath();
   g.arc(m.x+Math.sin(t*.4+m.ph)*22,y<0?y+1200:y,m.r,0,TAU);g.fill();}

/* ===================== TIMELINE ===================== */
const OV=1.35;
const starts=[];{let a=0;for(const s of SC){starts.push(a);a+=s.dur-OV;}}
const TOTAL=starts[starts.length-1]+SC[SC.length-1].dur-OV;
function layersAt(T){
 const out=[];
 for(let i=0;i<SC.length;i++){
  for(const off of [0,TOTAL,-TOTAL]){
   const lt=T-starts[i]-off;
   if(lt>=0&&lt<SC[i].dur){
    const inA=clamp(lt/OV,0,1);
    const outA=clamp((SC[i].dur-lt)/OV,0,1);
    const enter=SC[i].enter==null?.6:SC[i].enter;
    let zmul=1;
    if(lt<OV)zmul=lerp(enter,1,ease(inA));
    if(lt>SC[i].dur-OV)zmul=1+2.3*ease(1-outA);
    out.push({i,sc:SC[i],lt,alpha:inA,zmul,ord:starts[i]+off});
   }
  }
 }
 out.sort((a,b)=>a.ord-b.ord);
 return out.length>2?out.slice(-2):out;
}

let AC=null,soundOn=false,master,busOut,verb,limiter;
let vTight,vMed,vVast;
let beds=[],pinkBuf,noiseBuf,tapBufs=[],rockBufs=[];
function pinkData(n){const d=new Float32Array(n);let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
 for(let i=0;i<n;i++){const w=Math.random()*2-1;
  b0=.99886*b0+w*.0555179;b1=.99332*b1+w*.0750759;b2=.969*b2+w*.153852;
  b3=.8665*b3+w*.3104856;b4=.55*b4+w*.5329522;b5=-.7616*b5-w*.016898;
  d[i]=(b0+b1+b2+b3+b4+b5+b6+w*.5362)*.11;b6=w*.115926;}return d;}
function gn(v){const n=AC.createGain();n.gain.value=v;return n;}
function bq(type,f,q){const n=AC.createBiquadFilter();n.type=type;n.frequency.value=f;if(q!=null)n.Q.value=q;return n;}
function loopOf(buf,rate){const s=AC.createBufferSource();s.buffer=buf;s.loop=true;if(rate)s.playbackRate.value=rate;s.start();return s;}
function pan(v){if(!AC.createStereoPanner)return gn(1);const n=AC.createStereoPanner();n.pan.value=v;return n;}
function bufOf(d){const b=AC.createBuffer(1,d.length,AC.sampleRate);b.copyToChannel(d,0);return b;}
function rockData(sr,dur,cut){const n=Math.floor(sr*dur),d=new Float32Array(n);let lp=0,lp2=0;
 for(let i=0;i<n;i++){const t=i/sr,e=Math.exp(-t*(1/dur)*11);   // hard decay, nothing rings
  lp+=cut*((Math.random()*2-1)-lp);lp2+=cut*.55*(lp-lp2);
  d[i]=lp2*e;}
 for(let i=0;i<24&&i<n;i++)d[i]*=i/24;return d;}
function tapData(sr,freq,dur,bright){const n=Math.floor(sr*dur),d=new Float32Array(n);let lp=0;
 for(let i=0;i<n;i++){const t=i/sr,e=Math.exp(-t*(1/dur)*7);
  lp+=bright*((Math.random()*2-1)-lp);
  d[i]=(lp*.85+Math.sin(TAU*freq*t)*.35*Math.exp(-t*90))*e;}
 for(let i=0;i<64&&i<n;i++)d[i]*=i/64;return d;}
function irOf(sr,sec,decay,tone){const n=Math.floor(sr*sec),ir=AC.createBuffer(2,n,sr);
 for(let c=0;c<2;c++){const d=ir.getChannelData(c);let lp=0;
  for(let i=0;i<n;i++){lp+=tone*((Math.random()*2-1)-lp);d[i]=lp*Math.pow(1-i/n,decay);}}
 return ir;}

// the acoustic of each place: which of the three spaces, and how much of it
// declarative layers: [src, playbackRate, filterType, freq, Q, gain, panPos]
function initAudio(){
 AC=new (window.AudioContext||window.webkitAudioContext)();
 const sr=AC.sampleRate;
 master=gn(0);
 limiter=AC.createDynamicsCompressor();
 limiter.threshold.value=-3;limiter.knee.value=6;limiter.ratio.value=14;
 limiter.attack.value=.002;limiter.release.value=.22;
 const hp=bq('highpass',28,.7);                  // rumble you cannot hear only eats headroom
 master.connect(hp).connect(limiter).connect(AC.destination);
 const mkVerb=(sec,dec,tone,lvl,pre,hpf)=>{
  const c=AC.createConvolver();c.buffer=irOf(sr,sec,dec,tone);
  const inp=gn(1);
  const hpv=bq('highpass',hpf,.7);            // bass into a long tail is mud, never space
  inp.connect(hpv);
  if(pre){const dl=AC.createDelay(.25);dl.delayTime.value=pre;hpv.connect(dl).connect(c);}
  else hpv.connect(c);
  c.connect(gn(lvl)).connect(master);return inp;};
 vTight=mkVerb(.55,2.4,.48,.85,0,150);                // a room, a flower bed, close to a turntable
 vMed  =mkVerb(1.9,2.6,.26,.85,.022,165);             // open ground, street canyons
 vVast =mkVerb(4.4,2.1,.11,.80,.065,170);             // the deep ocean, a valley under an eruption
 verb=vMed;
 busOut=gn(1);busOut.connect(master);
 pinkBuf=bufOf(pinkData(sr*4));
 noiseBuf=bufOf((()=>{const d=new Float32Array(sr*4);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return d;})());
 for(let i=0;i<16;i++)tapBufs.push(bufOf(tapData(sr,rnd(1100,3400),rnd(.014,.045),rnd(.55,.97))));
 // A spread from block to pebble. The dull end alone put all the debris below 500 Hz, where
 // a phone speaker has nothing: the volcano measured -19.7 dB of transient in the 400 Hz-8 kHz
 // band against -10.0 before, so on a handset the loudest scene in the piece had gone quiet.
 // Small stone clatters bright; what keeps it from being hiss is the decay, not the filter.
 for(let i=0;i<16;i++)rockBufs.push(bufOf(rockData(sr,rnd(.03,.11),.14+(i/15)*.46)));
 SC.forEach((sc,i)=>{
  const spec=sc.bed;
  const out=gn(0);out.connect(busOut);            // scene weight ONLY: 0 has to mean silence
  const sp=sc.space;
  out.connect(gn(sp[1])).connect(sp[0]==='t'?vTight:sp[0]==='m'?vMed:vVast);
  // The breathing is a gain stage in SERIES. An LFO connected to out.gain is ADDED to it
  // (spec: a param's value is its intrinsic value plus its connected inputs), so every bed
  // kept sounding at up to 12% even with its scene weight at zero -- eight beds of filtered
  // noise running under all eight scenes, forever. That is what a constant hiss is made of.
  const breathe=gn(.80);breathe.connect(out);
  spec.forEach(([src,rate,ft,f,q,lg,pp],j)=>{
   const filt=bq(ft,f,q);
   loopOf(src==='p'?pinkBuf:noiseBuf,rate).connect(filt).connect(gn(lg)).connect(pan(pp)).connect(breathe);
   if(j===0){                                     // the main layer sweeps, so the bed breathes
    const sw=AC.createOscillator();sw.frequency.value=.014+i*.007;
    sw.connect(gn(f*.30)).connect(filt.frequency);sw.start();}
  });
  const lfo=AC.createOscillator();lfo.frequency.value=.03+i*.012;
  const d=gn(.12);lfo.connect(d).connect(breathe.gain);lfo.start();
  beds.push(out);
 });
 {// the hummingbird's wings are always visible, so their hum is always there
  const src=loopOf(pinkBuf,.9),bp=bq('bandpass',330,2.4),am=gn(0);
  const lfo=AC.createOscillator();lfo.type='sawtooth';lfo.frequency.value=52;
  const dep=gn(.5),bias=AC.createConstantSource();bias.offset.value=.5;
  lfo.connect(dep).connect(am.gain);bias.connect(am.gain);lfo.start();bias.start();
  src.connect(bp).connect(am).connect(gn(.34)).connect(beds[5]);}
}
function tone(f0,f1,dur,peak,type,dest,vibHz,vibD){
 if(!soundOn)return;const t0=AC.currentTime,o=AC.createOscillator();o.type=type||'sine';
 o.frequency.setValueAtTime(f0,t0);o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t0+dur);
 const g2=gn(0);
 g2.gain.setValueAtTime(0,t0);g2.gain.linearRampToValueAtTime(peak,t0+Math.min(.25,dur*.25));
 g2.gain.setValueAtTime(peak,t0+dur*.6);g2.gain.exponentialRampToValueAtTime(.0008,t0+dur);
 if(vibHz){const v=AC.createOscillator();v.frequency.value=vibHz;const vd=gn(vibD);
  v.connect(vd).connect(o.frequency);v.start(t0);v.stop(t0+dur);}
 o.connect(g2).connect(dest||busOut);o.start(t0);o.stop(t0+dur+.05);
}
function siren(f,dur,peak,dest){
 if(!soundOn)return;const t0=AC.currentTime;
 const o=AC.createOscillator();o.type='sawtooth';o.frequency.value=f;
 const lp=bq('lowpass',760,.7);                  // half a kilometre of air, not a chiptune
 const g2=gn(0);
 g2.gain.setValueAtTime(0,t0);
 g2.gain.linearRampToValueAtTime(peak,t0+.09);
 g2.gain.setValueAtTime(peak,t0+dur*.7);
 g2.gain.exponentialRampToValueAtTime(.0006,t0+dur);
 o.connect(lp).connect(g2).connect(dest||busOut);o.start(t0);o.stop(t0+dur+.05);
}
function horn(f,dur,peak,dest){                   // a dual-tone horn, heard from far above
 if(!soundOn)return;const t0=AC.currentTime;
 const o=AC.createOscillator();o.type='sawtooth';o.frequency.value=f;
 const lp=bq('lowpass',f*2.4,.7),g2=gn(0);        // only the first partials get here
 g2.gain.setValueAtTime(0,t0);
 g2.gain.linearRampToValueAtTime(peak,t0+.05);
 g2.gain.setValueAtTime(peak,t0+dur*.75);
 g2.gain.exponentialRampToValueAtTime(.0005,t0+dur);
 o.connect(lp).connect(g2).connect(dest||busOut);o.start(t0);o.stop(t0+dur+.05);
}
function swell(dur,peak,f,q,pp,dest,rate){
 if(!soundOn)return;const t0=AC.currentTime,s=AC.createBufferSource();
 s.buffer=noiseBuf;s.playbackRate.value=rate||1;s.loop=true;
 const bp2=bq('bandpass',f,q),g2=gn(0);
 g2.gain.setValueAtTime(0,t0);
 g2.gain.linearRampToValueAtTime(peak,t0+dur*.45);
 g2.gain.exponentialRampToValueAtTime(.0008,t0+dur);
 s.connect(bp2).connect(g2).connect(pan(pp)).connect(dest||busOut);
 s.start(t0,Math.random()*3);s.stop(t0+dur+.06);
}
function nblast(dur,peak,f0,f1,dest,pp){        // an explosion's noise, not a block of hiss
 if(!soundOn)return;const t0=AC.currentTime,s=AC.createBufferSource();
 s.buffer=noiseBuf;s.loop=true;s.playbackRate.value=.85;
 const lp=bq('lowpass',f0,.8),hp2=bq('highpass',90,.7),g2=gn(0);
 lp.frequency.setValueAtTime(f0,t0);
 lp.frequency.exponentialRampToValueAtTime(f1,t0+dur*.9);   // the top end goes first
 g2.gain.setValueAtTime(0,t0);
 g2.gain.linearRampToValueAtTime(peak,t0+.008);             // instant, the way a blast opens
 g2.gain.exponentialRampToValueAtTime(.0004,t0+dur);
 s.connect(hp2).connect(lp).connect(g2).connect(pan(pp||0)).connect(dest||busOut);

}
function burst(buf,rate,peak,pp,dest,hp){
 if(!soundOn)return;const t0=AC.currentTime,s=AC.createBufferSource();
 s.buffer=buf;s.playbackRate.value=rate;
 let node=s;if(hp){const f=bq('highpass',hp,.7);s.connect(f);node=f;}
 const g2=gn(peak);node.connect(g2).connect(pan(pp)).connect(dest||busOut);
 const off=s.buffer.duration>.5?Math.random()*(s.buffer.duration-.3):0;  // seeking past the end of a
 s.start(t0,off);s.stop(t0+.5);                                          // short tap renders silence
}
const LAST={};                                     // nothing retriggers on top of itself
function gate(k,ms){const n=performance.now();if(LAST[k]&&n-LAST[k]<ms)return false;LAST[k]=n;return true;}
// per-scene accents. Amplitude comes from the scene's own bus, so they fade with it.
// a short melody that surfaces only over the record
const MEL=[0,3,7,10,7,3,12,7],ROOT=196;
let melT=0,melI=0;
function melody(dt,w,d){
 if(!soundOn||w<.25)return;melT-=dt;
 if(melT<=0){melT=.42;
  const f=ROOT*Math.pow(2,MEL[melI%MEL.length]/12);melI++;
  tone(f,f,.5,.085,'triangle',d);
  tone(f*2,f*2,.34,.03,'sine',d);}
}
const btn=document.getElementById('snd');
function setSound(on){

 if(on)for(const k in EV)EVSEEN[k]=EV[k];
 if(AC){if(on)AC.resume();master.gain.setTargetAtTime(on?.95:0,AC.currentTime,.2);}

}

function resize(){
 const dpr=Math.min(window.devicePixelRatio||1,2);
 const n=Math.max(320,Math.round(cv.clientWidth*dpr));
 cv.width=cv.height=A.width=A.height=B.width=B.height=n;px=n/L;
 texLinen=document.createElement('canvas');texLinen.width=texLinen.height=n;
 const tl=texLinen.getContext('2d');tl.fillStyle='#fff';tl.fillRect(0,0,n,n);
 const st=Math.max(2,3*dpr);
 for(let i=0;i<n;i+=st){tl.fillStyle=`rgba(40,20,60,${.16+Math.random()*.2})`;
  tl.fillRect(0,i,n,Math.max(1,dpr*.8));tl.fillRect(i,0,Math.max(1,dpr*.8),n);}
 texDots=document.createElement('canvas');texDots.width=texDots.height=n;
 const td=texDots.getContext('2d');const sp=6*dpr;
 for(let y=0,row=0;y<n+sp;y+=sp*.866,row++){td.beginPath();
  for(let x=(row%2?sp/2:0);x<n+sp;x+=sp){td.moveTo(x+1.4*dpr,y);td.arc(x,y,1.4*dpr,0,TAU);}
  td.fillStyle=row%3?'rgba(255,255,255,.5)':'rgba(255,240,120,.42)';td.fill();}
 vign=ctx.createRadialGradient(n/2,n/2,n*.32,n/2,n/2,n*.76);
 vign.addColorStop(0,'rgba(0,0,0,0)');vign.addColorStop(1,'rgba(14,4,32,.46)');
}
function paint(buf,L2){
 g=buf.getContext('2d');
 g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,buf.width,buf.height);
 const c=L2.sc.cam(clamp(L2.lt/L2.sc.dur,0,1),L2.lt);
 const z=c.z*L2.zmul;
 g.setTransform(px*z,0,0,px*z,px*(500-c.x*z),px*(500-c.y*z));
 g.save();L2.sc.draw(L2.lt,clamp(L2.lt/L2.sc.dur,0,1));g.restore();
}
const lbl=document.getElementById('lbl'),tc=document.getElementById('tc'),bar=document.getElementById('bar');
let last=performance.now(),T=0,shown='';
function frame(now){
 const dt=Math.min(.05,(now-last)/1000);last=now;
 T=(T+dt)%TOTAL;
 const Ls=layersAt(T);
 const n=cv.width;
 ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
 ctx.fillStyle='#000';ctx.fillRect(0,0,n,n);
 // audio weights follow the visuals exactly
 const w=new Array(SC.length).fill(0);
 for(const l of Ls)w[l.i]=Math.max(w[l.i],l===Ls[Ls.length-1]?l.alpha:1-(Ls[Ls.length-1]||{alpha:0}).alpha);
 if(Ls.length===1)w[Ls[0].i]=1;
 if(AC&&soundOn){const nowT=AC.currentTime;
  for(let i=0;i<beds.length;i++)beds[i].gain.setTargetAtTime(w[i]*SC[i].trim,nowT,.05);
  // an event sound only fires while its scene IS the picture: during a crossfade the outgoing
  // scene's exit zoom throws its own source out of frame, and you hear what you cannot see
  for(let i=0;i<SC.length;i++)if(w[i]>.40)SC[i].acc(dt,w[i],beds[i]);
  melody(dt,w[7],beds[7]);}
 paint(A,Ls[0]);
 ctx.drawImage(A,0,0);
 if(Ls[1]){paint(B,Ls[1]);ctx.globalAlpha=Ls[1].alpha;ctx.drawImage(B,0,0);ctx.globalAlpha=1;}
 ctx.globalCompositeOperation='multiply';ctx.globalAlpha=.5;ctx.drawImage(texLinen,0,0);
 ctx.globalCompositeOperation='overlay';ctx.globalAlpha=.55;ctx.drawImage(texDots,0,0);
 ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
 ctx.fillStyle=vign;ctx.fillRect(0,0,n,n);
 if(!RENDER){
  const top=Ls[Ls.length-1].sc.name;
  if(top!==shown){shown=top;lbl.textContent=top;}
  tc.textContent='0:'+String(Math.floor(T)).padStart(2,'0');
  bar.style.width=(T/TOTAL*100).toFixed(2)+'%';
 }
