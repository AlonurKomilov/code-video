name: audit

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Install
        run: |
          npm ci || npm install
          npx playwright install --with-deps chromium
      - name: Build
        run: |
          mkdir -p build
          node tools/build.mjs src/characters/hooded-walker.json \
                               src/characters/plated-guard.json build/film.frag
          python3 tools/mkfilm.py
      # No GPU on a build runner, so the renderer runs on SwiftShader. Nothing here
      # is measured in absolute milliseconds except the cost check, and that one is
      # a ratio against itself.
      - name: Audit
        run: node test/run.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oq-kocha
          path: build/oq-kocha.html
