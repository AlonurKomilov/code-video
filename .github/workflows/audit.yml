name: audit
on: [push, pull_request]
jobs:
  oq-kocha:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm i && npx playwright install --with-deps chromium
        working-directory: oq-kocha
      - run: npm run build && npm run audit
        working-directory: oq-kocha
  loyihalar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm i playwright && npx playwright install --with-deps chromium
        working-directory: loyihalar
      - run: node tools/karta.mjs && node test/run.mjs
        working-directory: loyihalar
