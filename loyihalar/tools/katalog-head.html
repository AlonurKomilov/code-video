<title>Uslublar katalogi</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* A swatch book is printed on neutral grey card, because grey is the one ground that
   does not bias the swatches lying on it. Everything here is that card; the only
   colour on the page belongs to the work being catalogued. */
:root{
 --card:#d6d6d3; --sheet:#eaeae7; --ink:#16181a; --muted:#5d6063; --rule:#bcbcb8;
 --faint:#c8c8c4; --accent:#3a6659; --warn:#8a4a2c;
 --shadow:0 1px 0 rgba(0,0,0,.07), 0 10px 24px -18px rgba(0,0,0,.45);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
 --card:#191a1c; --sheet:#232426; --ink:#e9e9e6; --muted:#95989b; --rule:#34363a;
 --faint:#2c2e32; --accent:#7fb3a2; --warn:#d08b62;
 --shadow:0 1px 0 rgba(255,255,255,.04), 0 10px 24px -18px rgba(0,0,0,.9);
}}
:root[data-theme="dark"]{
 --card:#191a1c; --sheet:#232426; --ink:#e9e9e6; --muted:#95989b; --rule:#34363a;
 --faint:#2c2e32; --accent:#7fb3a2; --warn:#d08b62;
 --shadow:0 1px 0 rgba(255,255,255,.04), 0 10px 24px -18px rgba(0,0,0,.9);
}
*{box-sizing:border-box}
body{background:var(--card); color:var(--ink);
 font-family:"Newsreader",Georgia,serif; font-size:17px; line-height:1.55;
 -webkit-font-smoothing:antialiased;}
.wrap{max-width:1080px; margin:0 auto; padding-inline:20px; padding-block:clamp(32px,6vw,64px);}
h1,h2,h3,.disp{font-family:"Bricolage Grotesque","Archivo",system-ui,sans-serif; text-wrap:balance;}
.mono{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;}
.eyebrow{font-family:"JetBrains Mono",monospace; font-size:11px; letter-spacing:.14em;
 text-transform:uppercase; color:var(--muted);}
h1{font-size:clamp(34px,6.4vw,58px); line-height:1.02; font-weight:700; letter-spacing:-.022em; margin:.34em 0 .28em;}
.lede{font-size:clamp(17px,2.1vw,20px); max-width:62ch; color:var(--ink); margin:0 0 6px;}
.lede em{font-style:italic;}
hr.rule{border:0; border-top:1px solid var(--rule); margin:38px 0 30px;}

/* the three axes */
.axes{display:grid; gap:14px; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); margin:26px 0 8px;}
.axis{border-top:2px solid var(--ink); padding-top:10px;}
.axis h3{font-size:16px; margin:0 0 4px; letter-spacing:-.01em; font-weight:700;}
.axis p{margin:0; font-size:15px; color:var(--muted); line-height:1.5;}
.axis .k{font-family:"JetBrains Mono",monospace; font-size:11px; color:var(--accent); letter-spacing:.08em;}

/* specimen cards */
.cards{display:flex; flex-direction:column; gap:18px;}
.spec{background:var(--sheet); border:1px solid var(--rule); box-shadow:var(--shadow);
 display:grid; grid-template-columns:260px 1fr 232px; gap:0; align-items:stretch;}
.spec .plate{border-right:1px solid var(--rule); padding:14px; display:flex; flex-direction:column; gap:10px;}
.spec .plate img{display:block; width:100%; max-width:100%; border:1px solid var(--rule);}
.swatches{display:flex; height:22px; border:1px solid var(--rule);}
.swatches i{display:block; height:100%;}
.spec .body{padding:16px 20px; min-width:0;}
.spec .body h2{font-size:25px; font-weight:700; letter-spacing:-.02em; margin:2px 0 2px; line-height:1.1;}
.spec .body .src{font-family:"JetBrains Mono",monospace; font-size:11.5px; color:var(--muted); letter-spacing:.02em;}
.spec .body p{margin:9px 0 0; font-size:15.5px; line-height:1.5;}
.tri{display:grid; grid-template-columns:auto 1fr; gap:3px 12px; margin:12px 0 0; font-size:14px;}
.tri dt{font-family:"JetBrains Mono",monospace; font-size:10.5px; letter-spacing:.1em;
 text-transform:uppercase; color:var(--muted); padding-top:4px;}
.tri dd{margin:0; color:var(--ink);}
.spec .meas{border-left:1px solid var(--rule); padding:16px 18px; background:transparent;}
.meas .eyebrow{display:block; margin-bottom:10px;}
.bar{margin-bottom:9px;}
.bar .lab{display:flex; justify-content:space-between; gap:8px;
 font-family:"JetBrains Mono",monospace; font-size:10.5px; color:var(--muted); letter-spacing:.03em;}
.bar .lab b{color:var(--ink); font-weight:600; font-variant-numeric:tabular-nums;}
.bar .track{height:5px; background:var(--faint); margin-top:3px; position:relative;}
.bar .fill{height:100%; background:var(--accent);}
.bar .fill.thin{background:var(--warn);}
.range{position:relative; height:5px; background:var(--faint); margin-top:3px;}
.range i{position:absolute; top:0; height:100%; background:linear-gradient(90deg,#1a1a1a,#f2f2f2);}
.needs{grid-column:1/-1; border-top:1px solid var(--rule); padding:11px 20px;
 font-size:15px; display:flex; gap:10px; align-items:baseline;}
.needs b{font-family:"JetBrains Mono",monospace; font-size:10.5px; letter-spacing:.1em;
 text-transform:uppercase; color:var(--warn); white-space:nowrap; padding-top:2px;}
@media (max-width:860px){
 .spec{grid-template-columns:1fr;}
 .spec .plate{border-right:0; border-bottom:1px solid var(--rule);}
 .spec .meas{border-left:0; border-top:1px solid var(--rule);}
}
/* the chart */
.chartbox{background:var(--sheet); border:1px solid var(--rule); box-shadow:var(--shadow); padding:18px 18px 8px;}
.chartbox h2{font-size:23px; margin:0 0 2px; letter-spacing:-.018em;}
.chartbox p{margin:6px 0 14px; font-size:15.5px; color:var(--muted); max-width:62ch;}
.chartscroll{overflow-x:auto;}
svg{display:block; width:100%; height:auto; min-width:520px;}
.note{font-size:15px; color:var(--muted); max-width:66ch;}
.note b{color:var(--ink); font-weight:500;}
footer{margin-top:34px; padding-top:16px; border-top:1px solid var(--rule);
 font-family:"JetBrains Mono",monospace; font-size:11px; color:var(--muted); letter-spacing:.03em; line-height:1.7;}
.pair{margin-top:12px}
.pair .eyebrow{display:block;margin-bottom:4px}
.spec .body .pair p{margin:0;font-size:15px;line-height:1.52}
ul.us{margin:0;padding-left:17px;font-size:14.5px;line-height:1.5}
ul.us li{margin-bottom:4px}
.dalil{font-family:"JetBrains Mono",monospace;font-size:10.5px;color:var(--accent);white-space:nowrap}
.axis.mut h3,.axis.mut p{color:var(--muted)} .axis.mut{border-top-color:var(--rule)}
.tuzatish{margin-top:22px;border:1px solid var(--warn);border-left-width:3px;
 padding:13px 16px;font-size:15px;line-height:1.55;background:var(--sheet)}
.tuzatish b{color:var(--warn)}
.spec .body h2{font-size:27px}
</style>
